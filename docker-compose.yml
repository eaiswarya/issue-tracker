services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: issuetracker
      POSTGRES_USER: issuetracker
      POSTGRES_PASSWORD: issuetracker
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U issuetracker -d issuetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
