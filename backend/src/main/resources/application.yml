spring:
  application:
    name: issue-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/issuetracker}
    username: ${DB_USERNAME:issuetracker}
    password: ${DB_PASSWORD:issuetracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:./application-local.yml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app:
  auth:
    # Required, at least 32 bytes. Set JWT_SECRET in the environment or in application-local.yml; never commit it.
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    lockout:
      max-attempts: 5
      window: 15m
      duration: 15m

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
