spring:
  application:
    name: issue-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:${DB_PORT:5432}/issuetracker}
    username: ${DB_USERNAME:issuetracker}
    password: ${DB_PASSWORD:issuetracker}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  config:
    import: optional:file:./application-local.yml
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /swagger-ui.html
